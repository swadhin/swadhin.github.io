<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Royal Velvet Purple Gradient -->
    <linearGradient id="regalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="35%" stop-color="#7c3aed"/>
      <stop offset="70%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <!-- Platinum / Lavender Inset Border -->
    <linearGradient id="regalTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#e9d5ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.15"/>
    </linearGradient>
    <!-- Gold / Platinum Crown Gradient -->
    <linearGradient id="crownGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#regalBg)"/>
  <!-- Beveled Inset Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#regalTrim)" stroke-width="1.5"/>

  <!-- Minimalist Regal Coronet / Crown -->
  <path d="M 22.5 13 L 26.5 17.5 L 32 11 L 37.5 17.5 L 41.5 13 L 39.5 20.5 H 24.5 Z" fill="url(#crownGlow)" opacity="0.95"/>
  <!-- Crown Finial Pearls -->
  <circle cx="32" cy="9" r="1.8" fill="#ffffff"/>
  <circle cx="22.5" cy="11.5" r="1.3" fill="#f5d0fe"/>
  <circle cx="41.5" cy="11.5" r="1.3" fill="#f5d0fe"/>

  <!-- Monogram SP (High Contrast Regal Serif Type) -->
  <g fill="#ffffff">
    <!-- Regal S -->
    <path d="M 29.8 28.5 C 29.2 24.5 25.8 22.5 21.8 22.5 C 17 22.5 13.8 24.8 13.8 28.2 C 13.8 31 16 32.5 19.5 33.8 L 22 34.8 C 26 36.4 28 38.5 28 41.5 C 28 45.2 24.5 48 19.5 48 C 14.8 48 11.8 45.2 11.2 41 L 15.2 40.2 C 15.6 43 17.5 44.8 19.8 44.8 C 22.4 44.8 24.4 43.2 24.4 41.2 C 24.4 38.8 22.4 37.4 18.8 36 L 16.2 35 C 12.8 33.5 10.4 31.2 10.4 27.8 C 10.4 23.5 14.5 19.5 21.5 19.5 C 27.5 19.5 30.5 23.5 30.6 28.2 Z"/>
    
    <!-- Regal P -->
    <path d="M 32.5 20.5 H 43.5 C 49 20.5 53 23.5 53 28.2 C 53 33 49 36 43.5 36 H 37 V 44.5 H 40 V 47.5 H 30 V 44.5 H 32.5 V 23.5 H 30 V 20.5 Z M 37 23.8 V 32.8 H 43 C 46.8 32.8 49.2 30.8 49.2 28.2 C 49.2 25.5 46.8 23.8 43 23.8 Z"/>
  </g>
</svg>